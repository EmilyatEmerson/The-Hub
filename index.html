<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Hub</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Inter, system-ui, sans-serif;
    background: #0F3D24;
    color: white;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
  }
  .logo {
    width: 72px;
    height: 72px;
    background: #00A651;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 700;
    margin: 0 auto 24px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  h1 {
    font-size: 48px;
    font-weight: 700;
    letter-spacing: -1px;
    margin-bottom: 8px;
  }
  h1 span { color: #00A651; }
  .subtitle {
    font-size: 20px;
    color: rgba(255,255,255,0.7);
    margin-bottom: 48px;
  }
  .construction {
    margin: 0 auto 40px;
    position: relative;
    width: 200px;
    height: 160px;
  }
  .crane-base {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 80px;
    background: #00A651;
    border-radius: 4px;
  }
  .crane-arm {
    position: absolute;
    bottom: 78px;
    left: 50%;
    transform: translateX(-10px);
    width: 100px;
    height: 12px;
    background: #00A651;
    border-radius: 4px;
    transform-origin: 10px 6px;
    animation: swing 3s ease-in-out infinite;
  }
  @keyframes swing {
    0%, 100% { transform: rotate(-10deg); }
    50% { transform: rotate(10deg); }
  }
  .hook {
    position: absolute;
    right: -4px;
    top: 12px;
    width: 2px;
    height: 30px;
    background: rgba(255,255,255,0.6);
    animation: swing 3s ease-in-out infinite;
    transform-origin: top center;
  }
  .block {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 30px;
    background: #1A6B3C;
    border: 2px solid #00A651;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    animation: buildUp 3s ease-in-out infinite;
  }
  @keyframes buildUp {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-8px); }
  }
  .stars {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .star {
    position: absolute;
    font-size: 16px;
    animation: twinkle 2s infinite;
  }
  .star:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
  .star:nth-child(2) { top: 20%; right: 15%; animation-delay: 0.5s; }
  .star:nth-child(3) { top: 60%; left: 5%; animation-delay: 1s; }
  .star:nth-child(4) { bottom: 20%; right: 5%; animation-delay: 1.5s; }
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }
  .message {
    font-size: 16px;
    color: rgba(255,255,255,0.6);
    max-width: 400px;
    line-height: 1.6;
    margin-bottom: 32px;
  }
  .dots {
    display: inline-flex;
    gap: 6px;
  }
  .dot {
    width: 8px;
    height: 8px;
    background: #00A651;
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>
  <div class="stars">
    <div class="star">✨</div>
    <div class="star">⭐</div>
    <div class="star">✨</div>
    <div class="star">⭐</div>
  </div>
  <div class="logo">H</div>
  <h1>The Hub <span>2.0</span></h1>
  <p class="subtitle">We're switching over — hang tight! 🚧</p>
  <div class="construction">
    <div class="crane-base"></div>
    <div class="crane-arm">
      <div class="hook"></div>
    </div>
    <div class="block">🔨</div>
  </div>
  <div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</body>
</html>
